/**:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # 强行匹配雷达物理极限
    laser_max_range: 10.0
    laser_min_range: 0.2

    # 队列扩容与超时容忍
    transform_timeout: 0.8
    tf_buffer_duration: 10.0
    message_queue_size: 100 
    
    resolution: 0.05
    map_update_interval: 1.0
