/**:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # Match the simulated lidar range in diff_drive_gazebo.urdf.xacro.
    max_laser_range: 8.0

    # Keep generous queues for Gazebo/RViz startup transients.
    transform_timeout: 0.8
    tf_buffer_duration: 10.0
    message_queue_size: 100

    resolution: 0.05
    map_update_interval: 1.0
